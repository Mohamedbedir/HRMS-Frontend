<div class="admin-wrapper" [class.sidebar-collapsed]="sidebarCollapsed" [class.dark-mode]="isDarkMode">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <a [routerLink]="employeeId ? ['employees', employeeId] : ['attendance']" class="brand text-decoration-none">
        <img src="HR-Icon.ico" alt="HRMS Logo" class="brand-logo">
        <span class="brand-text">HRMS</span>
      </a>
      <button type="button" class="btn sidebar-close d-lg-none" (click)="toggleSidebar()" aria-label="Close sidebar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="sidebar-body">
      <small class="nav-title">WORKSPACE</small>
      <nav class="nav flex-column">
        <a [routerLink]="employeeId ? ['employees', employeeId] : ['attendance']" routerLinkActive="active"
          class="nav-link" title="My Profile">
          <i class="bi bi-person-circle"></i>
          <span class="nav-text">My Profile</span>
        </a>
        <a routerLink="attendance" routerLinkActive="active" class="nav-link" title="Attendance">
          <i class="bi bi-clock-history"></i>
          <span class="nav-text">Attendance</span>
        </a>
        <a routerLink="performance-reviews" routerLinkActive="active" class="nav-link" title="Performance Reviews">
          <i class="bi bi-graph-up-arrow"></i>
          <span class="nav-text">Performance Reviews</span>
        </a>
        <a routerLink="leave-requests" routerLinkActive="active" class="nav-link" title="Leave Requests">
          <i class="bi bi-calendar2-check"></i>
          <span class="nav-text">Leave Requests</span>
        </a>
        <a routerLink="payroll" routerLinkActive="active" class="nav-link" title="My Payroll">
          <i class="bi bi-wallet2"></i>
          <span class="nav-text">My Payroll</span>
        </a>
        <a routerLink="employee-documents" routerLinkActive="active" class="nav-link" title="My Documents">
          <i class="bi bi-folder2-open"></i>
          <span class="nav-text">My Documents</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <button type="button" class="logout-button" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span class="nav-text">Logout</span>
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-navbar">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="menu-button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
          <i class="bi bi-list"></i>
        </button>
        <small class="text-muted">Welcome back</small>
      </div>

      <div class="d-flex align-items-center gap-3">
        <button type="button" class="icon-button theme-button" (click)="toggleTheme()"
          [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
          <i class="bi" [class.bi-sun-fill]="isDarkMode" [class.bi-moon-stars-fill]="!isDarkMode"></i>
        </button>
        <button type="button" class="icon-button position-relative" aria-label="Notifications">
          <i class="bi bi-bell"></i>
          <span class="notification-dot"></span>
        </button>
        <div class="dropdown">
          <button type="button" class="user-button dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="avatar">{{ userEmail.charAt(0).toUpperCase() }}</div>
            <div class="user-info d-none d-md-block text-start">
              <span class="user-name">{{ userName }}</span>
            </div>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
            <li><h6 class="dropdown-header">{{ userEmail }}</h6></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item text-danger" type="button" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <main class="admin-content">
      <div class="container-fluid">
        <router-outlet></router-outlet>
      </div>
    </main>

    <footer class="admin-footer">
      <span>© {{ currentYear }} HRMS</span>
      <span>Human Resources Management System</span>
    </footer>
  </div>
</div>
